<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pulsarlube Privacy Policy</title>
  <script>
    // Chinese is intentionally not offered yet (no live zh translation) -
    // falls through to English rather than routing to the unmaintained
    // zh/ page.
    var lang = (navigator.language || navigator.userLanguage || 'en').toLowerCase();
    if (lang.startsWith('ko')) { location.replace('ko/'); }
    else if (lang.startsWith('ja')) { location.replace('ja/'); }
    else { location.replace('en/'); }
  </script>
</head>
<body style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;text-align:center;padding:60px;color:#555;">
  <p>Redirecting&hellip; <a href="en/">Click here if not redirected</a></p>
</body>
</html>
